# Checks and puts it live every time main is pushed, in the go-live order:
#   0. changes: what changed since the last publish that went green (scripts/ci-changes.sh)
#   1. checks, side by side: the site's (typecheck + build, and the tests split across 4 machines) and the
#      database rules (db, in db-tests.yml, only when database files changed)
#   2. live database: applies new migrations (scripts/apply-live-migrations.sh)
#   3. server functions: builds each one and deploys those whose build differs from the last green publish's
#   4. the site, to GitHub Pages
# If any step fails, the later ones don't run. A push that only changes notes and plans (docs/, top-level .md)
# does nothing. Because everything is measured from the last green publish, a run that was dropped from the
# queue or failed is caught up by the next one. Steps 2 and 3 need the repo secret SUPABASE_ACCESS_TOKEN;
# without it they say so and are skipped (the site still publishes).
name: Test and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      functions:
        description: "Server functions to deploy anyway, space-separated (e.g. 'clans lord'), or 'all'"
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.what.outputs.site }}
      db: ${{ steps.what.outputs.db }}
      base: ${{ steps.what.outputs.base }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Only the scripts and git's list of changed files, not the 350 MB of art and code: seconds instead of 15-30.
          filter: blob:none
          sparse-checkout: scripts
      - id: what
        run: |
          # The commit of the last "Test and publish" that went green on main: everything after it is new.
          base=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)
          if [ -n "$base" ] && ! git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then base=""; fi
          echo "Last green publish: ${base:-none found}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          scripts/ci-changes.sh "$base"
          # Run by hand: always check and publish everything, whatever changed.
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "site=true" >> "$GITHUB_OUTPUT"; echo "db=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: [changes]
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Every server function must still build (they are built again, and deployed, after the database step).
      - run: npm run build:functions
      # Put back the files the last publish used for a while, so pages already open still load their games.
      - run: node scripts/keep-old-assets.mjs dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  tests:
    needs: [changes]
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    name: tests (${{ matrix.shard }} of 4)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Always the full set of tests (test:all), never the quick one: a quarter of the files on each machine.
      - run: npm run test:all -- --shard=${{ matrix.shard }}/4

  db:
    needs: [changes]
    if: needs.changes.outputs.db == 'true'
    uses: ./.github/workflows/db-tests.yml

  database:
    needs: [changes, build, tests, db]
    # Runs when the site checks passed and the database checks passed or weren't needed.
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.tests.result == 'success' &&
      (needs.db.result == 'success' || needs.db.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: live-database
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Just the migrations and the script that applies them.
          sparse-checkout: |
            scripts
            supabase
      - name: Apply new migrations to the live database
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::No SUPABASE_ACCESS_TOKEN secret, so migrations were not applied."
            exit 0
          fi
          scripts/apply-live-migrations.sh

  functions:
    needs: [changes, database]
    if: ${{ !cancelled() && needs.database.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BASE: ${{ needs.changes.outputs.base }}
      EXTRA: ${{ inputs.functions }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The built index.ts files aren't kept in git: build every function here, and build them again as they were at the
      # last green publish. A function goes live when its build differs (or it is new, or there is no last green publish).
      - name: Work out which server functions changed
        id: which
        run: |
          npm run build:functions > /dev/null
          all=$(node -e "import('./scripts/build-functions.mjs').then(m => console.log(m.FUNCTIONS.join(' ')))")
          if [ "$EXTRA" = "all" ] || [ -z "$BASE" ]; then
            names="$all"
          else
            git worktree add -q --detach "$RUNNER_TEMP/base" "$BASE"
            ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/node_modules"
            (cd "$RUNNER_TEMP/base" && node scripts/build-functions.mjs > /dev/null)
            names="$EXTRA"
            for n in $all; do
              cmp -s "supabase/functions/$n/index.ts" "$RUNNER_TEMP/base/supabase/functions/$n/index.ts" || names="$names $n"
            done
          fi
          names=$(echo $names | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "Functions to deploy: ${names:-none}"
          echo "names=$names" >> "$GITHUB_OUTPUT"
      - name: Deploy changed server functions
        env:
          NAMES: ${{ steps.which.outputs.names }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::No SUPABASE_ACCESS_TOKEN secret, so no server functions were deployed."
            exit 0
          fi
          if [ -z "${NAMES// }" ]; then echo "No server function changed."; exit 0; fi
          # Supabase sometimes times out for a moment (24 Nov 2026); deploying again is safe, so try each one up to 3 times.
          for n in $NAMES; do
            for i in 1 2 3; do
              echo "Deploying $n ..."
              npx supabase functions deploy "$n" --project-ref zqzhetlzvtptnkmeiumi --no-verify-jwt --use-api && break
              [ $i -eq 3 ] && exit 1
              echo "Trying $n again in $((20 * i)) seconds ..."; sleep $((20 * i))
            done
          done

  deploy:
    needs: [functions]
    if: ${{ !cancelled() && needs.functions.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
