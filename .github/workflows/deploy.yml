# Checks the site and publishes it to GitHub Pages every time main is pushed.
# If any check fails, nothing is published and the live site stays as it was.
# Two sets of checks run side by side: the site's (build) and the database rules (db, in db-tests.yml).
name: Test and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same three steps as `npm run check`.
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  db:
    uses: ./.github/workflows/db-tests.yml

  deploy:
    needs: [build, db]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
