<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Archery Fight Art</title>
    <style>
      :root { --strip: rgba(16, 20, 36, 0.62); --ink: #fff; --btn: #ffc83d; --btn-ink: #2a1c14; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #1d2433; color: var(--ink); font: 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
      #fight { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      .ar-top, .ar-bottom { position: fixed; left: 0; right: 0; background: var(--strip); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; }
      .ar-top { top: 0; min-height: 48px; }
      .ar-bottom { bottom: 0; min-height: 88px; }
      button, select { min-height: 40px; min-width: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--btn); color: var(--btn-ink); font: inherit; font-weight: 800; cursor: pointer; }
      select { background: #fff; }
      button[aria-pressed="true"] { background: #6fe36a; }
      #stats { font: 12px/1.2 ui-monospace, monospace; opacity: 0.85; margin-left: auto; }
      label { display: inline-flex; gap: 4px; align-items: center; }
    </style>
  </head>
  <body>
    <canvas id="fight" aria-label="Archery fight"></canvas>
    <div class="ar-top" id="top">
      <strong>Fight art test</strong>
      <select id="world" aria-label="World">
        <option value="forest">Forest</option>
        <option value="desert">Desert</option>
        <option value="snow">Snow</option>
        <option value="city">City</option>
      </select>
      <button id="newLand">New land</button>
      <span id="stats" aria-live="off"></span>
    </div>
    <div class="ar-bottom" id="bottom">
      <button id="fire">Fire (F)</button>
      <button id="miss">Near miss (M)</button>
      <button id="auto" aria-pressed="false">Auto play</button>
      <button id="simple" aria-pressed="false">Simpler graphics</button>
      <button id="less" aria-pressed="false">Less motion</button>
      <label><input type="checkbox" id="steel" checked /> Steel</label>
      <span id="msg"></span>
    </div>
    <script type="module" src="./art.ts"></script>
  </body>
</html>
