<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Archery Engine Test</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <style>
      :root { --bg: #f4f1ec; --ink: #1d2433; --soft: #5a6275; --card: #fff; --line: #d9d4cb; --btn: #24305e; --btn-ink: #fff; --accent: #b3261e; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --bg: #14171f; --ink: #eef0f5; --soft: #a8afc0; --card: #1e2230; --line: #343a4d; --btn: #8fa2ff; --btn-ink: #10142a; --accent: #ff8a80; color-scheme: dark; }
      }
      :root[data-theme="dark"] { --bg: #14171f; --ink: #eef0f5; --soft: #a8afc0; --card: #1e2230; --line: #343a4d; --btn: #8fa2ff; --btn-ink: #10142a; --accent: #ff8a80; color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
      .ar-page { max-width: 1000px; margin: 0 auto; padding-block: 12px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; }
      h1 { margin: 0; font-size: 1.3rem; }
      .ar-note { margin: 0; color: var(--soft); font-size: 0.9rem; }
      canvas { width: 100%; height: auto; display: block; border-radius: 8px; border: 1px solid var(--line); background: #9fc6e8; touch-action: manipulation; }
      .ar-status { display: flex; flex-wrap: wrap; gap: 8px 16px; font-weight: 600; }
      .ar-status .ar-turn { color: var(--accent); }
      .ar-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
      .ar-box { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; }
      .ar-row { display: flex; align-items: center; gap: 8px; }
      .ar-row output { min-width: 4.5em; font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
      .ar-row input[type="range"] { flex: 1; min-height: 44px; }
      button { min-height: 44px; min-width: 44px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--btn); color: var(--btn-ink); font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: default; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      select { min-height: 44px; font: inherit; border-radius: 8px; padding: 0 8px; background: var(--card); color: var(--ink); border: 1px solid var(--line); }
      .ar-fire { background: var(--accent); color: #fff; font-size: 1.1rem; flex: 1; }
      .ar-log { margin: 0; color: var(--soft); font-size: 0.9rem; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <main class="ar-page">
      <h1>Archery Challenge: engine test</h1>
      <p class="ar-note">Plain shapes only, no art yet. Two players take turns on one screen. No aiming line on purpose: try an angle and a power, and adjust. Keys: ← → angle, ↑ ↓ power, space to fire.</p>
      <canvas id="field" width="960" height="540" aria-label="The battlefield"></canvas>
      <div class="ar-status" aria-live="polite">
        <span id="turn" class="ar-turn"></span>
        <span id="wind"></span>
        <span id="round"></span>
        <span id="health"></span>
      </div>
      <p id="log" class="ar-log" aria-live="polite"></p>
      <div class="ar-controls">
        <div class="ar-box">
          <label class="ar-row" for="angle">Angle</label>
          <div class="ar-row">
            <button type="button" data-step="angle:-1" aria-label="Angle down">−</button>
            <input id="angle" type="range" min="0" max="180" step="1" />
            <button type="button" data-step="angle:1" aria-label="Angle up">+</button>
            <output id="angleOut"></output>
          </div>
        </div>
        <div class="ar-box">
          <label class="ar-row" for="power">Power</label>
          <div class="ar-row">
            <button type="button" data-step="power:-1" aria-label="Power down">−</button>
            <input id="power" type="range" min="0" max="100" step="1" />
            <button type="button" data-step="power:1" aria-label="Power up">+</button>
            <output id="powerOut"></output>
          </div>
        </div>
        <div class="ar-box">
          <label class="ar-row" for="arrow">Arrow</label>
          <select id="arrow"></select>
          <div class="ar-row">
            <button id="fire" type="button" class="ar-fire">Fire</button>
            <button id="newLand" type="button">New land</button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
